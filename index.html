E:x=>{x.beginPath();x.moveTo(-32,-24);x.lineTo(32,-24);x.moveTo(-10,-24);x.lineTo(-10,-34);x.lineTo(10,-34);x.lineTo(10,-24);x.stroke();x.beginPath();x.moveTo(-24,-24);x.lineTo(-18,36);x.lineTo(18,36);x.lineTo(24,-24);x.stroke();x.beginPath();x.moveTo(-6,-10);x.lineTo(-6,24);x.moveTo(6,-10);x.lineTo(6,24);x.stroke()},
F:x=>{x.beginPath();x.arc(0,0,12,0,7);x.stroke();[[-38,-28],[38,-28],[-38,28],[38,28]].forEach(p=>{x.beginPath();x.moveTo(p[0]*.32,p[1]*.32);x.lineTo(p[0]*.82,p[1]*.82);x.stroke();x.beginPath();x.arc(p[0],p[1],7,0,7);x.stroke()})}};
function mkSph(n){
 const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
 const col=PC[n.id],FONT=f=>'500 '+f+"px Inter,system-ui,sans-serif",RR=220;
 let fs=50,lines;
 for(;fs>20;fs-=2){x.font=FONT(fs);lines=[];let cur='';n.t.split(' ').forEach(w=>{const t=cur?cur+' '+w:w;if(x.measureText(t).width>300&&cur){lines.push(cur);cur=w}else cur=t});lines.push(cur);
  if(Math.max(...lines.map(l=>x.measureText(l).width))<=300&&lines.length*fs*1.2<=260)break}
 x.beginPath();x.arc(256,256,RR,0,7);x.fillStyle='#111114';x.fill();
 x.strokeStyle=col;x.lineWidth=5;x.beginPath();x.arc(256,256,RR,0,7);x.stroke();
 x.fillStyle='#ececee';x.textAlign='center';x.textBaseline='middle';x.font=FONT(fs);
 const lh=fs*1.2,top=256-lines.length*lh/2;
 lines.forEach((l,i)=>x.fillText(l,256,top+lh*(i+.5)));
 const tex=new THREE.CanvasTexture(c);tex.anisotropy=8;
 return new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,depthTest:false}));
}
const pick=[];
N.forEach(n=>{
 n.mat=new THREE.MeshBasicMaterial({visible:false});
 n.mesh=new THREE.Mesh(new THREE.SphereGeometry(n.r,24,16),n.mat);n.mesh.position.copy(n.p);n.mesh.userData.n=n;scene.add(n.mesh);
 n.sp=mkSph(n);n.sp.position.copy(n.p);n.sp.scale.set(n.r*2.35,n.r*2.35,1);n.sp.userData.n=n;scene.add(n.sp);pick.push(n.mesh,n.sp);
});
if(document.fonts&&document.fonts.load)Promise.all([document.fonts.load('500 40px Inter')]).then(()=>N.forEach(n=>{const m=mkSph(n).material.map;n.sp.material.map=m;n.sp.material.needsUpdate=true})).catch(()=>{});
const ECOL={c:0x5c584f,r:0xb4492d,m:0x3f8f8a};
const edgePick=[];
const ecol=e=>new THREE.Color(e.k==='c'?PC[e.a.id]:ECOL[e.k]);
function cyl(p,q,r,mat,e){const d=q.clone().sub(p),L=d.length();const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,8,1),mat);m.scale.y=L;m.position.copy(p).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.userData.e=e;scene.add(m);edgePick.push(m);return m}
E.forEach(e=>{
 const u=e.b.p.clone().sub(e.a.p).normalize(),hl=17,hr=5.5,tr=.9;
 const p=e.a.p.clone().addScaledVector(u,e.a.r*1.18),q=e.b.p.clone().addScaledVector(u,-(e.b.r*1.18+4));

 e.mats=[mat];

 const p2=p.clone(),q2=q.clone();

const FL=[];E.forEach(e=>{const u=e.b.p.clone().sub(e.a.p),L=u.length();const k=e.k==='m'?2:3;for(let i=0;i<k;i++)FL.push({e,t:i/k,v:.0016+Math.random()*.0008,d:1,L});if(e.k==='r')for(let i=0;i<2;i++)FL.push({e,t:i/2+.25,v:.0016+Math.random()*.0008,d:-1,L})});
